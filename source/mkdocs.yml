site_name: My CV
site_url: https://P3120-505199.github.io/My-CV/
site_description: Резюме и портфолио
site_author: Богун Андрей

theme:
  name: material 
  font:
    text: Roboto           
    code: Fira Code
  language: ru
  features:
  - navigation.tabs
  - navigation.sections
  - toc.integrate
  - navigation.top
  - navigation.tracking         
  - navigation.expand           
  - navigation.indexes           
  - search.suggest
  - search.highlight
  - content.tabs.link
  - content.code.annotation
  - content.code.copy
  - content.action.edit          
  - content.action.view  
  palette:
  - scheme: default
    toggle:
      icon: material/toggle-switch-off-outline
      name: Switch to dark mode
    primary: deep purple
    accent: purple
  - scheme: slate
    toggle:
      icon: material/toggle-switch
      name: Switch to light mode
    primary: deep purple
    accent: pink

nav:
  - Главная: index.md
  - Опыт работы: experience.md
  - Навыки: skills.md
  - Образование: education.md
  - Контакты: contacts.md

extra:
